<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f0ff">
<title>URL → QR 코드 만들기</title>
<style>
:root{--purple:#7256d9;--purple2:#967cf0;--ink:#29233b;--muted:#766e89;--bg:#f8f6ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px;display:grid;place-items:center;background:radial-gradient(circle at 10% 10%,#eee8ff,transparent 35%),radial-gradient(circle at 90% 90%,#ffe8f1,transparent 30%),var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}
.app{width:min(100%,460px);background:#ffffffed;border:1px solid #fff;border-radius:28px;padding:28px 22px;box-shadow:0 20px 60px #6d52b51a;text-align:center}
.logo{width:64px;height:64px;border-radius:20px;background:#f0ebff;display:grid;place-items:center;font-size:32px;margin:0 auto 15px}
.kicker{font-size:12px;letter-spacing:2px;font-weight:800;color:var(--purple)}
h1{font-size:30px;letter-spacing:-1px;margin:8px 0}
.intro{font-size:14px;line-height:1.7;color:var(--muted);margin:0 auto 24px;max-width:320px}
label{display:block;text-align:left;font-size:13px;font-weight:800;margin:0 0 8px}
input{width:100%;padding:15px 14px;border:1px solid #ddd5f6;border-radius:14px;font:inherit;font-size:15px;outline:none;background:#fff;color:var(--ink)}
input:focus{border-color:var(--purple);box-shadow:0 0 0 3px #7256d91c}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;font-weight:800;padding:14px 16px;transition:transform .15s,opacity .15s}
button:active{transform:scale(.98)}
.primary{width:100%;margin-top:12px;color:white;background:linear-gradient(100deg,var(--purple),var(--purple2));box-shadow:0 8px 18px #7256d933}
.result{margin-top:22px;padding:18px 14px 16px;background:#faf8ff;border:1px solid #eee8ff;border-radius:20px}
.result.hidden{display:none}
#qrcode{min-height:220px;display:grid;place-items:center;background:white;border-radius:16px;padding:12px;margin:0 auto 14px;width:min(100%,250px)}
#qrcode img,#qrcode canvas{max-width:100%;height:auto!important}
.status{font-size:13px;line-height:1.6;color:var(--muted);overflow-wrap:anywhere;margin:0 0 13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.secondary{background:#eee9ff;color:#5941b7}
.soft{background:#fff0f6;color:#ad4776}
.foot{font-size:11px;color:#a29aaf;line-height:1.6;margin:18px 0 0}
.toast{min-height:18px;font-size:12px;color:#5d4b8b;margin-top:10px}
@media(max-width:360px){h1{font-size:26px}.app{padding:24px 16px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
  <div class="logo" aria-hidden="true">▦</div>
  <div class="kicker">QUICK QR MAKER</div>
  <h1>URL을 QR 코드로</h1>
  <p class="intro">웹사이트 주소를 입력하면 바로 QR 코드를 만들어 줘요.<br>카메라로 스캔해서 사이트를 열 수 있어요.</p>
  <form id="qrForm">
    <label for="urlInput">웹사이트 URL</label>
    <input id="urlInput" type="url" placeholder="https://example.com" autocomplete="url" required>
    <button class="primary" type="submit">QR 코드 만들기 ✨</button>
  </form>
  <section id="result" class="result hidden" aria-live="polite">
    <div id="qrcode" aria-label="생성된 QR 코드"></div>
    <p id="shownUrl" class="status"></p>
    <div class="actions">
      <button id="downloadBtn" class="secondary" type="button">PNG 저장하기 ↓</button>
      <button id="copyBtn" class="soft" type="button">URL 복사하기</button>
    </div>
    <div id="toast" class="toast" role="status"></div>
  </section>
  <p class="foot">※ QR 코드 생성에는 인터넷 연결이 필요해요.<br>아직 공개되지 않은 파일 주소는 다른 사람에게서 열리지 않을 수 있어요.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const form=document.getElementById('qrForm');
const input=document.getElementById('urlInput');
const result=document.getElementById('result');
const qrBox=document.getElementById('qrcode');
const shownUrl=document.getElementById('shownUrl');
const toast=document.getElementById('toast');
let currentUrl='';
function notify(message){toast.textContent=message;}
form.addEventListener('submit',function(event){
 event.preventDefault();
 let value=input.value.trim();
 if(!value){input.focus();return;}
 try{
  const parsed=new URL(value);
  if(!['http:','https:'].includes(parsed.protocol)){notify('http:// 또는 https:// 주소를 입력해 주세요.');return;}
  value=parsed.href;
 }catch(e){notify('올바른 URL을 입력해 주세요. 예: https://example.com');return;}
 if(typeof QRCode==='undefined'){notify('QR 생성 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');return;}
 currentUrl=value;
 qrBox.replaceChildren();
 new QRCode(qrBox,{text:currentUrl,width:220,height:220,colorDark:'#211b35',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
 shownUrl.textContent=currentUrl;
 result.classList.remove('hidden');
 notify('QR 코드가 만들어졌어요! 다른 기기의 카메라로 스캔해 보세요.');
});
document.getElementById('downloadBtn').addEventListener('click',function(){
 const canvas=qrBox.querySelector('canvas');
 const img=qrBox.querySelector('img');
 let data='';
 if(canvas)data=canvas.toDataURL('image/png');
 else if(img && img.src)data=img.src;
 if(!data){notify('먼저 QR 코드를 만들어 주세요.');return;}
 const a=document.createElement('a');a.href=data;a.download='qr-code.png';document.body.appendChild(a);a.click();a.remove();
 notify('QR 코드 PNG 저장을 시작했어요.');
});
document.getElementById('copyBtn').addEventListener('click',async function(){
 if(!currentUrl){notify('먼저 QR 코드를 만들어 주세요.');return;}
 try{
  await navigator.clipboard.writeText(currentUrl);
  notify('URL을 클립보드에 복사했어요!');
 }catch(e){
  input.value=currentUrl;input.focus();input.select();
  let ok=false;try{ok=document.execCommand('copy')}catch(_){}
  notify(ok?'URL을 복사했어요!':'주소 입력칸에서 URL을 길게 눌러 복사해 주세요.');
 }
});
const params=new URLSearchParams(location.search);
const preset=params.get('url');
if(preset){input.value=preset;}
</script>
</body>
</html>
